name: normalizacion-dev

# Perfiles:
#   --profile cola     → solo Postgres (desarrollo temprano)
#   --profile almacen  → + MinIO
#   --profile full     → infraestructura completa (Postgres+OS+MinIO+Prom+Grafana)
#   --profile app      → LA APLICACIÓN en contenedores (api + exportador + front)
#
# Prueba REAL con tu carpeta (idéntico en Mac y Windows):
#   NORM_CARPETA_DATOS=/ruta/a/tu/carpeta \
#     docker compose -f deploy/docker-compose.dev.yml --profile full --profile app up -d --wait
#   → interfaz en http://localhost:8080 (tu carpeta aparece como /datos)

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["cola", "full"]
    environment:
      POSTGRES_USER: norm
      POSTGRES_PASSWORD: norm
      POSTGRES_DB: normalizacion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norm -d normalizacion"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    profiles: ["full"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    profiles: ["almacen", "full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: norm
      MINIO_ROOT_PASSWORD: norm-secreto
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    profiles: ["full"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alertas.yml:/etc/prometheus/alertas.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:latest
    profiles: ["full"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: norm
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: ["app"]
    environment:
      NORM_POSTGRES_DSN: postgresql://norm:norm@postgres:5432/normalizacion
      NORM_OPENSEARCH_URL: http://opensearch:9200
      NORM_MINIO_ENDPOINT: minio:9000
      NORM_API_CARPETA_RAIZ: /datos
      NORM_API_CARPETA_DESTINO_RAIZ: /destino
      NORM_API_CORS_ORIGENES: '["http://localhost:8080","http://localhost:5173"]'
    volumes:
      # TU carpeta de contenido (solo lectura, como un disco de origen):
      - ${NORM_CARPETA_DATOS:-./datos-prueba}:/datos:ro
      # Carpeta de DESTINO elegible desde el front (escribible): si la corrida
      # elige destino, el almacén HOT y el frío quedan bajo ella, en tu disco
      - ${NORM_CARPETA_DESTINO:-./destino-prueba}:/destino
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: sh -c "alembic upgrade head && (norm aplicar-indice || true) && norm api --host 0.0.0.0 --puerto 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/openapi.json')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  exportador:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: ["app"]
    environment:
      NORM_POSTGRES_DSN: postgresql://norm:norm@postgres:5432/normalizacion
    depends_on:
      postgres: { condition: service_healthy }
    command: norm exportador --puerto 9108 --intervalo 15

  front:
    build:
      # Requiere los dos repos como carpetas hermanas (normalizacion-backend y -front)
      context: ../../normalizacion-front
      dockerfile: deploy/Dockerfile
    profiles: ["app"]
    ports:
      - "8080:80"
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  osdata:
  miniodata:
  grafanadata:
