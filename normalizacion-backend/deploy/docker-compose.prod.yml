name: normalizacion

# Despliegue de PRODUCCIÓN. Diferencias NO cosméticas con docker-compose.dev.yml:
#
#   1. NINGÚN servicio publica puertos al host salvo Caddy (:80/:443). El `.dev`
#      publica Postgres 5432, OpenSearch 9200, MinIO 9000/9001 y Grafana 3000 a
#      0.0.0.0 — en una Mac eso es localhost; en un VPS con IP pública es la base
#      de datos y el índice completos expuestos a internet.
#   2. OpenSearch CON su plugin de seguridad (el `.dev` lo desactiva).
#   3. Cero credenciales por defecto: todo secreto viene del entorno y el compose
#      falla al arrancar si falta (`${VAR:?mensaje}`).
#   4. ⚙K16 — el perfil de despliegue decide qué corre en este nodo.
#
# Arranque:
#   cp deploy/.env.prod.ejemplo .env.prod && $EDITOR .env.prod
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod \
#     --profile datos --profile app up -d
#
# Perfiles:
#   --profile datos  → Postgres + OpenSearch + MinIO (el plano de datos)
#   --profile app    → API + front + exportador + Caddy
#   --profile obs    → Prometheus + Grafana (internos, tras Caddy)

x-comun: &comun
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    <<: *comun
    image: postgres:16-alpine
    profiles: ["datos"]
    environment:
      POSTGRES_USER: ${NORM_PG_USER:?falta NORM_PG_USER}
      POSTGRES_PASSWORD: ${NORM_PG_PASSWORD:?falta NORM_PG_PASSWORD}
      POSTGRES_DB: ${NORM_PG_DB:-normalizacion}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    <<: *comun
    image: opensearchproject/opensearch:2.19.0
    profiles: ["datos"]
    environment:
      discovery.type: single-node
      # El plugin de seguridad QUEDA ACTIVO (el .dev lo apaga con
      # DISABLE_SECURITY_PLUGIN=true). Sin él, cualquiera con acceso de red al
      # 9200 lee y borra el índice entero sin credencial.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${NORM_OS_ADMIN_PASSWORD:?falta NORM_OS_ADMIN_PASSWORD}
      # Heap: ~1/2 de la RAM del contenedor; el resto queda para el page cache de
      # Lucene, que es quien de verdad sirve las búsquedas.
      OPENSEARCH_JAVA_OPTS: -Xms${NORM_OS_HEAP:-4g} -Xmx${NORM_OS_HEAP:-4g}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - osdata:/usr/share/opensearch/data
      - ./snapshots:/mnt/snapshots
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "curl -ksf -u admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  minio:
    <<: *comun
    image: minio/minio:latest
    profiles: ["datos"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NORM_MINIO_ROOT_USER:?falta NORM_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${NORM_MINIO_ROOT_PASSWORD:?falta NORM_MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    networks: [interna]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    <<: *comun
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: ["app"]
    environment:
      # ⚙K16 — QUÉ es este nodo. Sin esto arranca como `local`, que en un VPS
      # significaría archivo maestro y selector de destino: ninguno de los dos.
      NORM_DESPLIEGUE__PERFIL: ${NORM_DESPLIEGUE__PERFIL:?falta el perfil (local|hibrido-ingesta|hibrido-servicio)}
      NORM_DESPLIEGUE__NODO_ID: ${NORM_DESPLIEGUE__NODO_ID:?falta el nodo_id (p.ej. vps-01)}
      NORM_POSTGRES_DSN: postgresql://${NORM_PG_USER}:${NORM_PG_PASSWORD}@postgres:5432/${NORM_PG_DB:-normalizacion}
      NORM_OPENSEARCH_URL: ${NORM_OPENSEARCH_URL:-https://opensearch:9200}
      NORM_MINIO_ENDPOINT: minio:9000
      NORM_MINIO_ACCESS_KEY: ${NORM_MINIO_ROOT_USER}
      NORM_MINIO_SECRET_KEY: ${NORM_MINIO_ROOT_PASSWORD}
      # Llaves de la API: con la lista VACÍA la autenticación queda deshabilitada
      # (`llave_valida` devuelve True). En un nodo público eso es el índice entero
      # abierto, así que aquí es obligatorio.
      NORM_API_KEYS: ${NORM_API_KEYS:?falta NORM_API_KEYS (sin llaves la API queda SIN autenticación)}
      NORM_API_CORS_ORIGENES: ${NORM_API_CORS_ORIGENES:?falta NORM_API_CORS_ORIGENES}
      NORM_API_CARPETA_RAIZ: /datos
      # Sin volumen de destino a propósito: el nodo de servicio no ofrece selector.
      NORM_RECURSOS__POLITICA: ${NORM_RECURSOS__POLITICA:-maximo}
    volumes:
      - ${NORM_CARPETA_DATOS:?falta NORM_CARPETA_DATOS}:/datos:ro
    networks: [interna]
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: sh -c "alembic upgrade head && (norm aplicar-indice || true) && norm api --host 0.0.0.0 --puerto 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/openapi.json')\""]
      interval: 15s
      timeout: 5s
      retries: 12

  exportador:
    <<: *comun
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: ["app"]
    environment:
      NORM_POSTGRES_DSN: postgresql://${NORM_PG_USER}:${NORM_PG_PASSWORD}@postgres:5432/${NORM_PG_DB:-normalizacion}
      NORM_DESPLIEGUE__PERFIL: ${NORM_DESPLIEGUE__PERFIL}
      NORM_DESPLIEGUE__NODO_ID: ${NORM_DESPLIEGUE__NODO_ID}
    networks: [interna]
    depends_on:
      postgres: { condition: service_healthy }
    command: norm exportador --puerto 9108 --intervalo 15

  front:
    <<: *comun
    build:
      context: ../../normalizacion-front
      dockerfile: deploy/Dockerfile
    profiles: ["app"]
    networks: [interna]
    depends_on:
      api: { condition: service_healthy }

  caddy:
    <<: *comun
    image: caddy:2-alpine
    profiles: ["app"]
    # La ÚNICA superficie pública del despliegue. TLS automático por Caddy.
    ports:
      - "80:80"
      - "443:443"
    environment:
      NORM_DOMINIO: ${NORM_DOMINIO:?falta NORM_DOMINIO (Caddy necesita el nombre para emitir el certificado)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [interna]
    depends_on:
      front: { condition: service_started }

  prometheus:
    <<: *comun
    image: prom/prometheus:latest
    profiles: ["obs"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alertas.yml:/etc/prometheus/alertas.yml:ro
      - promdata:/prometheus
    networks: [interna]

  grafana:
    <<: *comun
    image: grafana/grafana-oss:latest
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${NORM_GRAFANA_PASSWORD:?falta NORM_GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: https://${NORM_DOMINIO}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [interna]

networks:
  interna:
    driver: bridge

volumes:
  pgdata:
  osdata:
  miniodata:
  grafanadata:
  promdata:
  caddydata:
  caddyconfig:
