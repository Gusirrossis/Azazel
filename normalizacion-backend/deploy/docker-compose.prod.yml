name: normalizacion

# Despliegue de PRODUCCIÓN. Diferencias NO cosméticas con docker-compose.dev.yml:
#
#   1. NINGÚN servicio publica puertos al host salvo Caddy (:80/:443). El `.dev`
#      publica Postgres 5432, OpenSearch 9200, MinIO 9000/9001 y Grafana 3000 a
#      0.0.0.0 — en una Mac eso es localhost; en un VPS con IP pública es la base
#      de datos y el índice completos expuestos a internet.
#   2. OpenSearch CON su plugin de seguridad (el `.dev` lo desactiva).
#   3. Cero credenciales por defecto: todo secreto viene del entorno y el compose
#      falla al arrancar si falta (`${VAR:?mensaje}`).
#   4. ⚙K16 — el perfil de despliegue decide qué corre en este nodo.
#
# Arranque:
#   cp deploy/.env.prod.ejemplo .env.prod && $EDITOR .env.prod
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod \
#     --profile datos --profile app up -d
#
# Perfiles:
#   --profile datos  → Postgres + OpenSearch + MinIO (el plano de datos)
#   --profile app    → API + front + exportador + Caddy
#   --profile obs    → Prometheus + Grafana (internos, tras Caddy)

x-comun: &comun
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    <<: *comun
    image: postgres:16-alpine
    profiles: ["datos"]
    environment:
      POSTGRES_USER: ${NORM_PG_USER:?falta NORM_PG_USER}
      POSTGRES_PASSWORD: ${NORM_PG_PASSWORD:?falta NORM_PG_PASSWORD}
      POSTGRES_DB: ${NORM_PG_DB:-normalizacion}
    # La imagen arranca con los valores de FÁBRICA: shared_buffers=128MB y
    # random_page_cost=4 (que asume discos giratorios). Para el plano de control
    # —la tabla `archivos`, con millones de filas y UPDATE constante— eso es dejar
    # la máquina parada. Estos valores dimensionan Postgres para SU parte del
    # servidor, no para todo: OpenSearch necesita la suya y los workers la suya.
    command:
      - postgres
      - -c
      - shared_buffers=${NORM_PG_SHARED_BUFFERS:-8GB}
      # No reserva memoria: le dice al planificador cuánta caché de SO puede
      # suponer. Generoso a propósito.
      - -c
      - effective_cache_size=${NORM_PG_CACHE_SIZE:-20GB}
      # Por conexión y por operación de orden: 32MB × ~40 conexiones reales
      # (2 por worker + API + exportador) es un techo sano.
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=2GB
      # NVMe: buscar en disco cuesta casi lo mismo que leer secuencial. Con el 4
      # por defecto el planificador evita índices que aquí sí compensan.
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - wal_buffers=64MB
      - -c
      - checkpoint_completion_target=0.9
      # `archivos` es una tabla-cola: cada fila se actualiza varias veces en su
      # ciclo de vida. Con el 0.2 por defecto, autovacuum espera a que el 20% esté
      # muerto antes de actuar y la tabla se infla — el propio worker ya evita
      # sostener transacciones largas por esto mismo.
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - autovacuum_naptime=30s
    # Las consultas paralelas usan memoria compartida; los 64MB por defecto de
    # Docker se quedan cortos y degradan a plan serie sin avisar.
    shm_size: 2gb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    <<: *comun
    # Imagen propia: la oficial no trae `repository-s3` y sin él no hay snapshots
    # hacia MinIO, es decir, no hay replicación del índice entre nodos (⚙K16).
    build:
      context: .
      dockerfile: Dockerfile.opensearch
    image: azazel-opensearch:2.19.0
    profiles: ["datos"]
    environment:
      discovery.type: single-node
      # Credenciales para el keystore de repository-s3 (ver opensearch-entrypoint.sh).
      NORM_S3_ACCESS_KEY: ${NORM_MINIO_ROOT_USER}
      NORM_S3_SECRET_KEY: ${NORM_MINIO_ROOT_PASSWORD}
      # Cliente S3 apuntando a MinIO (no a AWS): estas SÍ van por entorno/yml.
      s3.client.default.endpoint: minio:9000
      s3.client.default.protocol: http
      s3.client.default.path_style_access: "true"
      # MinIO no tiene regiones, pero el SDK de AWS EXIGE una: sin ella el snapshot
      # falla con "Unable to load region from any of the providers in the chain",
      # que el repositorio reporta sólo como "path is not accessible".
      s3.client.default.region: us-east-1
      # El plugin de seguridad QUEDA ACTIVO (el .dev lo apaga con
      # DISABLE_SECURITY_PLUGIN=true). Sin él, cualquiera con acceso de red al
      # 9200 lee y borra el índice entero sin credencial.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${NORM_OS_ADMIN_PASSWORD:?falta NORM_OS_ADMIN_PASSWORD}
      # Heap: nunca por encima de ~31g (más allá, la JVM pierde la compresión de
      # punteros y el heap RINDE MENOS aunque sea mayor). El resto de la RAM no se
      # desperdicia: la usa el page cache del SO, que es quien de verdad sirve las
      # búsquedas de Lucene. Por eso la regla es "la mitad al heap, la mitad al SO"
      # y no "todo lo que quepa".
      OPENSEARCH_JAVA_OPTS: -Xms${NORM_OS_HEAP:-4g} -Xmx${NORM_OS_HEAP:-4g}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - osdata:/usr/share/opensearch/data
      - ./snapshots:/mnt/snapshots
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "curl -ksf -u admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  minio:
    <<: *comun
    image: minio/minio:latest
    profiles: ["datos"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NORM_MINIO_ROOT_USER:?falta NORM_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${NORM_MINIO_ROOT_PASSWORD:?falta NORM_MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    networks: [interna]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    <<: *comun
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: ["app"]
    # Sin esto, NINGUNA perilla del .env.prod que no esté enumerada abajo llega al
    # contenedor: OCR, sesión y login se quedaban con sus valores por defecto y el
    # fichero de configuración era decorativo. `environment` sigue mandando sobre él.
    env_file:
      - ../.env.prod
    environment:
      # ⚙K16 — QUÉ es este nodo. Sin esto arranca como `local`, que en un VPS
      # significaría archivo maestro y selector de destino: ninguno de los dos.
      NORM_DESPLIEGUE__PERFIL: ${NORM_DESPLIEGUE__PERFIL:?falta el perfil (local|hibrido-ingesta|hibrido-servicio)}
      NORM_DESPLIEGUE__NODO_ID: ${NORM_DESPLIEGUE__NODO_ID:?falta el nodo_id (p.ej. vps-01)}
      NORM_POSTGRES_DSN: postgresql://${NORM_PG_USER}:${NORM_PG_PASSWORD}@postgres:5432/${NORM_PG_DB:-normalizacion}
      NORM_OPENSEARCH_URL: ${NORM_OPENSEARCH_URL:-https://opensearch:9200}
      # El plugin de seguridad está ACTIVO: sin credenciales el cliente no autentica
      # y búsqueda, sink y backfill fallan reportando sólo "no responde".
      NORM_OPENSEARCH_USUARIO: admin
      NORM_OPENSEARCH_PASSWORD: ${NORM_OS_ADMIN_PASSWORD}
      NORM_MINIO_ENDPOINT: minio:9000
      NORM_MINIO_ACCESS_KEY: ${NORM_MINIO_ROOT_USER}
      NORM_MINIO_SECRET_KEY: ${NORM_MINIO_ROOT_PASSWORD}
      # Llaves de la API: con la lista VACÍA la autenticación queda deshabilitada
      # (`llave_valida` devuelve True). En un nodo público eso es el índice entero
      # abierto, así que aquí es obligatorio.
      NORM_API_KEYS: ${NORM_API_KEYS:?falta NORM_API_KEYS (sin llaves la API queda SIN autenticación)}
      NORM_API_CORS_ORIGENES: ${NORM_API_CORS_ORIGENES:?falta NORM_API_CORS_ORIGENES}
      NORM_API_CARPETA_RAIZ: /datos
      # Sin volumen de destino a propósito: el nodo de servicio no ofrece selector.
      NORM_RECURSOS__POLITICA: ${NORM_RECURSOS__POLITICA:-maximo}
      # ⚙K11 — rendimiento: por debajo de este umbral el worker mantiene el archivo
      # en RAM; por encima lo vuelca a disco temporal. Con los 64 KB por defecto,
      # casi cualquier archivo toca disco DOS veces (se escribe el spool y se
      # relee para extraer). 6 workers x 8 MB son 48 MB: nada aquí, y el I/O es
      # justo el cuello del sistema.
      NORM_WORKER__UMBRAL_MEMORIA_BYTES: ${NORM_WORKER__UMBRAL_MEMORIA_BYTES:-8388608}
      # Blindaje: nº de workers acotado y FIJO. El gobernador adaptativo mira la RAM
      # del HOST (no el mem_limit del contenedor), así que sobredimensionaba.
      NORM_RECURSOS__MODO: ${NORM_RECURSOS__MODO:-fijo}
      NORM_WORKER__PROCESOS: ${NORM_WORKER__PROCESOS:-4}
    # Tope DURO de memoria del contenedor: si una extracción se dispara (bomba de
    # descompresión, archivo que se carga entero en RAM), el cgroup mata a ESE proceso
    # al llegar al tope y el box —OpenSearch, Postgres, SSH— sigue vivo. memswap=mem:
    # el contenedor no roba swap. Es la garantía de "no vuelve a tumbar la máquina".
    mem_limit: 6g
    memswap_limit: 6g
    volumes:
      - ${NORM_CARPETA_DATOS:?falta NORM_CARPETA_DATOS}:/datos:ro
    networks: [interna]
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: sh -c "alembic upgrade head && (norm aplicar-indice || true) && norm api --host 0.0.0.0 --puerto 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/openapi.json')\""]
      interval: 15s
      timeout: 5s
      retries: 12

  exportador:
    <<: *comun
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: ["app"]
    # Ver la nota de `api`: sin env_file las perillas del .env.prod no llegan.
    env_file:
      - ../.env.prod
    environment:
      NORM_POSTGRES_DSN: postgresql://${NORM_PG_USER}:${NORM_PG_PASSWORD}@postgres:5432/${NORM_PG_DB:-normalizacion}
      NORM_DESPLIEGUE__PERFIL: ${NORM_DESPLIEGUE__PERFIL}
      NORM_DESPLIEGUE__NODO_ID: ${NORM_DESPLIEGUE__NODO_ID}
    networks: [interna]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 512m
    memswap_limit: 512m
    command: norm exportador --puerto 9108 --intervalo 15

  # ⚙K16 — INGESTA AUTOMÁTICA (opcional). Vigila /datos/<fuente> y normaliza lo que
  # cae, sin intervención. DESACTIVADO por defecto: vive en su propio profile
  # `vigilante`, así que el `up` normal (datos/app/obs) y un reboot NO lo arrancan —
  # la ingesta es manual (API/CLI). Para reactivarlo (ya con mem_limit y anti-bomba):
  #   docker compose ... --profile vigilante up -d vigilante
  # Aun así lleva sus topes de memoria, por si se enciende.
  vigilante:
    <<: *comun
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: ["vigilante"]
    # Ver la nota de `api`: sin env_file las perillas del .env.prod no llegan.
    env_file:
      - ../.env.prod
    environment:
      NORM_DESPLIEGUE__PERFIL: ${NORM_DESPLIEGUE__PERFIL}
      NORM_DESPLIEGUE__NODO_ID: ${NORM_DESPLIEGUE__NODO_ID}
      NORM_POSTGRES_DSN: postgresql://${NORM_PG_USER}:${NORM_PG_PASSWORD}@postgres:5432/${NORM_PG_DB:-normalizacion}
      NORM_OPENSEARCH_URL: ${NORM_OPENSEARCH_URL:-https://opensearch:9200}
      NORM_OPENSEARCH_USUARIO: admin
      NORM_OPENSEARCH_PASSWORD: ${NORM_OS_ADMIN_PASSWORD}
      NORM_MINIO_ENDPOINT: minio:9000
      NORM_MINIO_ACCESS_KEY: ${NORM_MINIO_ROOT_USER}
      NORM_MINIO_SECRET_KEY: ${NORM_MINIO_ROOT_PASSWORD}
      NORM_API_CARPETA_RAIZ: /datos
      NORM_RECURSOS__POLITICA: ${NORM_RECURSOS__POLITICA:-maximo}
      NORM_WORKER__UMBRAL_MEMORIA_BYTES: ${NORM_WORKER__UMBRAL_MEMORIA_BYTES:-8388608}
      # Blindaje: workers acotados y FIJOS (el gobernador mira la RAM del host, no el
      # mem_limit del contenedor, así que sobredimensionaba y disparaba el OOM global).
      NORM_RECURSOS__MODO: ${NORM_RECURSOS__MODO:-fijo}
      NORM_WORKER__PROCESOS: ${NORM_WORKER__PROCESOS:-4}
      # Knobs del vigilante (el shell del contenedor arma los flags opcionales).
      NORM_VIGILANTE_INTERVALO: ${NORM_VIGILANTE_INTERVALO:-30}
      NORM_VIGILANTE_QUIESCENCIA: ${NORM_VIGILANTE_QUIESCENCIA:-60}
      NORM_VIGILANTE_SENTINELA: ${NORM_VIGILANTE_SENTINELA:-}
      NORM_VIGILANTE_RECLAMAR: ${NORM_VIGILANTE_RECLAMAR:-}
    # Tope DURO de memoria: aquí nacen los procesos worker de extracción. Si una
    # corrida se dispara (bomba de descompresión, archivo cargado entero en RAM), el
    # cgroup mata a ESE proceso al tope y el box sigue vivo. memswap=mem: sin swap
    # para el contenedor. Garantía de que la ingesta no vuelve a tumbar la máquina.
    mem_limit: 10g
    memswap_limit: 10g
    volumes:
      # RW (NO :ro): el vigilante es el ÚNICO que puede reclamar el origen —borrar el
      # lote ya normalizado— y solo tras puerta verde + firma estable. La API lo
      # sigue montando :ro. El almacén (MinIO) nunca se toca: retiene el 100%.
      - ${NORM_CARPETA_DATOS:?falta NORM_CARPETA_DATOS}:/datos:rw
    networks: [interna]
    depends_on:
      # A través de la API: cuando está healthy, `alembic upgrade head` y
      # `norm aplicar-indice` ya corrieron. El vigilante no re-migra.
      api: { condition: service_healthy }
    command:
      - sh
      - -c
      - >
        norm vigilante --intervalo "$$NORM_VIGILANTE_INTERVALO"
        --quiescencia "$$NORM_VIGILANTE_QUIESCENCIA"
        $${NORM_VIGILANTE_SENTINELA:+--sentinela $$NORM_VIGILANTE_SENTINELA}
        $${NORM_VIGILANTE_RECLAMAR:+--reclamar}

  front:
    <<: *comun
    build:
      context: ../../normalizacion-front
      dockerfile: deploy/Dockerfile
    profiles: ["app"]
    networks: [interna]
    depends_on:
      api: { condition: service_healthy }

  caddy:
    <<: *comun
    image: caddy:2-alpine
    profiles: ["app"]
    # La ÚNICA superficie pública del despliegue. TLS automático por Caddy.
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Opcional MIENTRAS NO HAYA DOMINIO: sin él, el Caddyfile sirve en :443 con la
      # CA interna (auto-firmado). Let's Encrypt no emite para IPs. Al conseguir el
      # dominio se pone aquí y se cambia el bloque del Caddyfile.
      NORM_DOMINIO: ${NORM_DOMINIO:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [interna]
    depends_on:
      front: { condition: service_started }

  prometheus:
    <<: *comun
    image: prom/prometheus:latest
    profiles: ["obs"]
    volumes:
      # El de PRODUCCIÓN: sin el objetivo `host.docker.internal` del .dev, que aquí
      # no existe y dejaría `ExportadorCaido` disparando para siempre.
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alertas.yml:/etc/prometheus/alertas.yml:ro
      - promdata:/prometheus
    networks: [interna]

  grafana:
    <<: *comun
    image: grafana/grafana-oss:latest
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${NORM_GRAFANA_PASSWORD:?falta NORM_GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: https://${NORM_DOMINIO:-localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [interna]

networks:
  interna:
    driver: bridge

volumes:
  pgdata:
  osdata:
  miniodata:
  grafanadata:
  promdata:
  caddydata:
  caddyconfig:
