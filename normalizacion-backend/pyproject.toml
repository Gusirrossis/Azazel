[project]
name = "normalizacion"
version = "0.1.0"
description = "Sistema de normalización masiva de datos: ingesta de discos desechables, precalificación doble filtro (T0-T4), almacén permanente content-addressed e índice de búsqueda en OpenSearch."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "typer>=0.12",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Cada máquina instala SOLO su rol: pip install "normalizacion[workers]"
deteccion = [
    "pyudev>=0.24; sys_platform == 'linux'",
]
workers = [
    "python-magic>=0.4.27",
    "charset-normalizer>=3.3",
    "polars>=1.0",
    "opensearch-py>=2.6",
    "minio>=7.2",
    "py7zr>=0.21",
    "rarfile>=4.2",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow>=10.3",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pip-licenses>=4.4",
    "httpx>=0.28.1",
]

[project.scripts]
norm = "normalizacion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normalizacion"]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

# ------------------------------------------------------------------ mypy
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src/normalizacion"]

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integracion: requiere servicios reales (Postgres/OpenSearch/MinIO en Docker)",
]
