server {
    listen 80;
    client_max_body_size 50m;

    # La app (SPA)
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Igual que el proxy de Vite en dev: /api/* -> servicio api (sin CORS)
    #
    # El `resolver` + la variable NO son adorno. Con `proxy_pass http://api:8000/`
    # literal, nginx resuelve el nombre UNA sola vez, al cargar la configuración, y
    # se queda con esa IP para siempre. Cada `docker compose up -d --build api` da
    # al contenedor una IP nueva, así que el front sigue apuntando a una que ya no
    # existe y todo /api/* responde 502 hasta reiniciarlo a mano. Pasó en el primer
    # despliegue del VPS.
    #
    # Con la dirección en una variable, nginx la resuelve en cada petición contra el
    # DNS interno de Docker (127.0.0.11), y el TTL corto hace que un reinicio del
    # backend se note en segundos en vez de nunca.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $destino_api api;

        # `proxy_pass` con variable NO reescribe el URI como lo hace la forma
        # literal con barra final, así que el prefijo /api se quita aquí.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$destino_api:8000;

        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;  # descargas grandes en streaming
    }
}
