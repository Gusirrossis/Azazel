server {
    listen 80;
    client_max_body_size 50m;

    # La app (SPA)
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Igual que el proxy de Vite en dev: /api/* -> servicio api (sin CORS)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;  # descargas grandes en streaming
    }
}
